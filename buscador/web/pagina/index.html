<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BuscaCartas do Boteco</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="balcao">
  <span class="nome-app">BuscaCartas do Boteco</span>
  <span class="sub-app">busca suas cartas de Magic nas lojas</span>
  <div class="canto">
    <div class="convite" id="convite" role="button" hidden>
      Primeira vez aqui? <b>Clique</b> que eu te mostro!
      <button class="convite-fechar" id="convite-fechar" aria-label="Dispensar o convite" title="Dispensar">×</button>
    </div>
    <button class="ajuda" id="ajuda" aria-label="Como funciona? Ver o tutorial">❓ Como funciona?</button>
  </div>
</header>
<div class="area">
<aside class="lousa">
  <h3>Lojas</h3>
  <p class="dica-ordem">Arraste <span class="alca">⠿</span> para mudar a ordem</p>
  <div id="lojas"></div>
  <div class="todas">
    <button class="link" id="todas">Todas</button>
    <button class="link" id="nenhuma">Nenhuma</button>
  </div>
  <button class="adicionar" id="adicionar">+ Adicionar loja</button>
  <div class="recado" aria-hidden="true">
    <span class="recado-titulo">Boteco de Pedidos</span>
    <span>as cartas que você procura,<br>direto das lojas</span>
  </div>
</aside>

<main>
  <div class="busca">
    <label class="campo">
      <span class="lupa" aria-hidden="true">🔍</span>
      <input id="carta" placeholder="Nome da carta (em português ou inglês)" spellcheck="false" autocomplete="off">
    </label>
    <button class="btn dica dica-longa" id="colar" aria-label="Colar o nome da carta copiada"
      data-dica="Copiou o nome de uma carta em outro lugar?&#10;Volte para esta janela e aperte Enter duas vezes:&#10;  1º Enter: cola o nome no campo&#10;  2º Enter: busca nas lojas&#10;(Clicar aqui ou Ctrl+V também colam.)">📋 Colar nome</button>
    <button class="btn primario" id="buscar">Buscar</button>
    <button class="btn dica" id="navegador" aria-label="Abrir esta busca nas lojas marcadas, no navegador" data-dica="Abrir esta busca nas lojas marcadas, no seu navegador">🌐</button>
  </div>

  <div class="opcoes">
    <label class="caixa"><input type="checkbox" id="exato"> Apenas nome exato</label>
    <button class="link" id="voltar" disabled>◀ Voltar</button>
    <button class="link" id="avancar" disabled>Avançar ▶</button>
    <label class="auto" title="Carrega sozinho as edições e preços quando a loja tem poucos itens (0 = desligado)">
      Edições e preços automáticos até
      <input type="number" id="auto" min="0" max="10" step="1"> itens
    </label>
    <button class="link direita" id="recolher">▲ Recolher tudo</button>
  </div>

  <div class="progresso" id="progresso"><div id="barra"></div></div>
  <div class="resultados" id="resultados"></div>

  <footer>
    <div id="resumo"></div>
    <button class="btn pequeno" id="abrir-achadas" disabled>Abrir só as lojas com a carta</button>
  </footer>
</main>
</div>

<div class="fundo-modal" id="modal" hidden>
  <form class="modal" id="form-loja">
    <h2>Adicionar loja</h2>
    <label><span class="rotulo-link">🔗 Link da loja</span>
      <input id="loja-link" type="url" inputmode="url" placeholder="www.minhaloja.com.br" autocomplete="off" spellcheck="false"></label>
    <label>Nome (opcional)<input id="loja-nome" autocomplete="off"></label>
    <p class="erro" id="loja-erro"></p>
    <div class="botoes">
      <button type="button" class="btn" id="cancelar-loja">Cancelar</button>
      <button type="submit" class="btn primario" id="adicionar-loja" disabled>Adicionar</button>
    </div>
  </form>
</div>

<div class="fundo-modal" id="pergunta" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pergunta-titulo">
    <h2 id="pergunta-titulo"></h2>
    <p class="pergunta-texto" id="pergunta-texto"></p>
    <div class="botoes">
      <button type="button" class="btn" id="pergunta-nao">Cancelar</button>
      <button type="button" class="btn primario" id="pergunta-sim">OK</button>
    </div>
  </div>
</div>

<img id="arte" alt="" hidden>

<!-- tutorial "Como funciona?" (tutorial.js): destaque em volta de um botão e um balão com a explicação -->
<div class="tour" id="tour" hidden>
  <div class="tour-foco" id="tour-foco"></div>
  <div class="tour-balao" id="tour-balao" role="dialog" aria-modal="true" aria-labelledby="tour-titulo">
    <h2 id="tour-titulo"></h2>
    <p id="tour-texto"></p>
    <div class="tour-pe">
      <span class="tour-pontos" id="tour-pontos"></span>
      <button class="link" id="tour-pular">Pular</button>
      <button class="link" id="tour-voltar">◀ Voltar</button>
      <button class="btn primario" id="tour-proximo">Próximo</button>
    </div>
  </div>
</div>

<!-- traço de giz: deixa as bordas do desenho da tela inicial um pouco irregulares -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="giz">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="ruido"/>
  <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2.4"/></filter></svg>

<script src="app.js"></script>
<script src="tutorial.js"></script>
</body>
</html>
